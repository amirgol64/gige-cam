<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigE-Cam</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">&#x1F4F7; GigE-Cam</span>
    <div class="nav-tabs">
      <a href="/live"     class="nav-tab {% if active == 'live'     %}active{% endif %}">Live Preview</a>
      <a href="/settings" class="nav-tab {% if active == 'settings' %}active{% endif %}">Settings</a>
      <a href="/system"   class="nav-tab {% if active == 'system'   %}active{% endif %}">System Info</a>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
